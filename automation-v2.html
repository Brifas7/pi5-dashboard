<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Automation</title>
<meta id="vp" name="viewport" content="width=1920">
<script>if(Math.min(screen.width,screen.height)<900){document.getElementById("vp").content="width=device-width, initial-scale=1";document.documentElement.classList.add("phone");var l=document.createElement("link");l.rel="stylesheet";l.href="automation-v2-phone.css?v=4";document.addEventListener("DOMContentLoaded",function(){document.head.appendChild(l)});}</script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Submenu palette (same as the kiosk's submenu theme lock) */
:root{--accent:#00b8a9;--accent-rgb:0,184,169;--text:#e0f8f5;--text-sub:#6ee7d8;
  --amber:#f59e0b;--amber-rgb:245,158,11;--red:#fca5a5;--red-rgb:220,40,40;--green:#86efac;--green-rgb:34,197,94;
  --font:'Rajdhani',system-ui,sans-serif;--mono:'Orbitron',ui-monospace,monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;color:var(--text);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
body{display:flex;flex-direction:column;}
.screen{display:none;flex-direction:column;height:100%;}
.screen.on{display:flex;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;flex-shrink:0;
  background:rgba(10,20,60,0.7);border-bottom:1px solid rgba(var(--accent-rgb),0.25);}
.ttl{font-size:26px;font-weight:700;letter-spacing:2px;}
.btn{background:rgba(var(--accent-rgb),0.15);border:1px solid rgba(var(--accent-rgb),0.35);color:var(--text);
  border-radius:10px;padding:14px 26px;font-family:var(--font);font-size:20px;font-weight:700;letter-spacing:1px;
  cursor:pointer;min-height:60px;}
.btn:active{background:rgba(var(--accent-rgb),0.35);}
.btn:disabled{opacity:.35;}
.btn.close,.btn.danger{background:rgba(var(--red-rgb),0.12);border-color:rgba(var(--red-rgb),0.4);color:var(--red);}
.btn.go{background:rgba(var(--green-rgb),0.15);border-color:rgba(var(--green-rgb),0.45);color:var(--green);}
.btn.small{min-height:48px;padding:8px 18px;font-size:17px;}
.banner{margin:16px 28px 0;padding:14px 20px;border-radius:10px;font-size:20px;font-weight:700;display:none;}
.banner.on{display:block;}
.banner.red{background:rgba(var(--red-rgb),0.15);border:1px solid rgba(var(--red-rgb),0.45);color:var(--red);}
.banner.amber{background:rgba(var(--amber-rgb),0.12);border:1px solid rgba(var(--amber-rgb),0.45);color:var(--amber);}
.body{flex:1;overflow-y:auto;padding:20px 28px 28px;display:flex;flex-direction:column;gap:12px;}
.label{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--text-sub);text-transform:uppercase;margin-top:10px;}
.card{background:rgba(var(--accent-rgb),0.08);border:1px solid rgba(var(--accent-rgb),0.25);border-radius:12px;padding:16px 22px;}
.empty{padding:40px;text-align:center;color:var(--text-sub);font-size:20px;font-weight:600;}
/* rule list */
.rule{display:flex;align-items:center;gap:22px;}
.rule.off .sent{opacity:.45;}
.rule .mid{flex:1;min-width:0;cursor:pointer;}
.sent{font-size:24px;font-weight:600;line-height:1.25;}
.sent b{color:#fff;font-weight:700;}
.meta{font-size:18px;color:var(--text-sub);margin-top:6px;font-weight:600;}
.chip{display:inline-block;font-size:15px;font-weight:700;letter-spacing:1px;border-radius:6px;padding:3px 10px;margin:0 8px 0 0;}
.meta .chip+*,.meta *+.chip{margin-left:8px;}
.chip.now{background:rgba(var(--accent-rgb),0.2);border:1px solid rgba(var(--accent-rgb),0.5);color:var(--text);}
.chip.warn{background:rgba(var(--amber-rgb),0.15);border:1px solid rgba(var(--amber-rgb),0.5);color:var(--amber);}
.chip.bad{background:rgba(var(--red-rgb),0.15);border:1px solid rgba(var(--red-rgb),0.5);color:var(--red);}
.tog{position:relative;width:84px;height:44px;flex-shrink:0;cursor:pointer;border-radius:44px;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);transition:.25s;}
.tog::after{content:'';position:absolute;top:5px;left:5px;width:32px;height:32px;border-radius:50%;background:#9fb5b2;transition:.25s;}
.tog.on{background:rgba(var(--green-rgb),0.3);border-color:rgba(var(--green-rgb),0.6);}
.tog.on::after{left:45px;background:var(--green);}
.skip{width:320px;flex-shrink:0;text-align:right;}
.light{display:flex;align-items:center;gap:18px;font-size:21px;font-weight:600;padding:8px 0;}
.light .n{width:260px;}
.light .s{flex:1;color:var(--text-sub);}
.amber{color:var(--amber)!important;}
/* builder */
.preview{padding:22px 28px;background:rgba(var(--accent-rgb),0.06);border-bottom:1px solid rgba(var(--accent-rgb),0.2);flex-shrink:0;}
.preview .sent{font-size:30px;}
.blank{color:var(--amber);border-bottom:2px dashed var(--amber);padding:0 6px;}
.steps{display:flex;gap:8px;padding:14px 28px 0;flex-shrink:0;}
.step{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:1px;padding:10px 4px;border-radius:8px;
  color:var(--text-sub);background:rgba(var(--accent-rgb),0.05);border:1px solid rgba(var(--accent-rgb),0.12);}
.step.cur{color:#fff;background:rgba(var(--accent-rgb),0.25);border-color:rgba(var(--accent-rgb),0.6);}
.step.done{color:var(--text);}
.foot{display:flex;align-items:center;gap:16px;padding:18px 28px;flex-shrink:0;border-top:1px solid rgba(var(--accent-rgb),0.2);}
.foot .msg{flex:1;text-align:center;font-size:19px;font-weight:700;color:var(--amber);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.pick{background:rgba(var(--accent-rgb),0.08);border:2px solid rgba(var(--accent-rgb),0.2);border-radius:12px;
  padding:18px 16px;cursor:pointer;min-height:96px;}
.pick.sel{background:rgba(var(--accent-rgb),0.28);border-color:var(--accent);}
.pick .t{font-size:23px;font-weight:700;}
.pick .d{font-size:17px;color:var(--text-sub);font-weight:600;margin-top:4px;}
.seg{display:flex;gap:0;width:520px;}
.seg .btn{flex:1;border-radius:0;font-size:22px;}
.seg .btn:first-child{border-radius:10px 0 0 10px;}
.seg .btn:last-child{border-radius:0 10px 10px 0;}
.seg .btn.sel{background:rgba(var(--accent-rgb),0.4);border-color:var(--accent);color:#fff;}
.spin{display:flex;align-items:center;gap:30px;margin-top:10px;}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;}
.col .btn{width:150px;font-size:26px;}
.big{font-family:var(--mono);font-size:72px;font-weight:700;min-width:150px;text-align:center;}
.colon{font-family:var(--mono);font-size:72px;font-weight:700;}
.hint{font-size:20px;color:var(--text-sub);font-weight:600;margin-top:12px;}
.days{display:flex;gap:12px;}
.days .btn{width:130px;font-size:22px;}
.btn.sel{background:rgba(var(--accent-rgb),0.4);border-color:var(--accent);color:#fff;}
.presets{display:flex;gap:12px;margin-bottom:8px;}
.cal{display:grid;grid-template-columns:repeat(7,150px);gap:10px;}
.cal div{height:76px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:22px;font-weight:700;}
.cal .h{height:36px;font-size:15px;color:var(--text-sub);letter-spacing:1px;}
.cal .d{border:1px dashed rgba(var(--accent-rgb),0.2);color:var(--text-sub);cursor:pointer;}
.cal .d.run{background:rgba(var(--accent-rgb),0.14);border:2px solid rgba(var(--accent-rgb),0.7);color:#fff;}
.cal .d.skp{background:rgba(var(--amber-rgb),0.25);border-color:var(--amber);color:#fff;text-decoration:line-through;}
.cal .d.past{opacity:.25;cursor:default;}
.calnav{display:flex;align-items:center;gap:20px;margin-bottom:10px;}
.calnav .m{font-size:26px;font-weight:700;width:300px;text-align:center;}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:10;}
.modal.on{display:flex;}
.modal .box{background:#04161a;border:1px solid rgba(var(--accent-rgb),0.5);border-radius:14px;padding:30px 36px;width:720px;}
.modal .q{font-size:26px;font-weight:700;margin-bottom:24px;line-height:1.3;}
.modal .row{display:flex;gap:14px;justify-content:flex-end;}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#04161a;border:1px solid var(--accent);
  border-radius:10px;padding:14px 26px;font-size:20px;font-weight:700;display:none;z-index:11;}
.toast.on{display:block;}
.toast.err{border-color:var(--red);color:var(--red);}
.form{gap:6px;}
.sec{display:flex;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid rgba(var(--accent-rgb),0.12);flex-wrap:wrap;}
.sec .q2{width:330px;font-size:22px;font-weight:700;flex-shrink:0;}
.sec .sub{flex-basis:100%;padding-left:348px;display:flex;flex-direction:column;gap:12px;}
.field{background:rgba(var(--accent-rgb),0.1);border:1px solid rgba(var(--accent-rgb),0.4);border-radius:10px;color:var(--text);
  font-family:var(--font);font-size:22px;font-weight:700;padding:12px 20px;min-height:60px;min-width:240px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;}
.field::after{content:'\25BE';color:var(--text-sub);}
.field.empty{color:var(--amber);border-color:rgba(var(--amber-rgb),0.5);}
.field.fixed{cursor:default;opacity:.8;}
.field.fixed::after{content:'';}
.field.wide{min-width:620px;max-width:1100px;}
.fieldrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.togrow{display:flex;align-items:center;gap:16px;font-size:20px;font-weight:600;color:var(--text-sub);}
.foot2{flex-shrink:0;border-top:1px solid rgba(var(--accent-rgb),0.25);background:rgba(var(--accent-rgb),0.06);}
.foot2 .sent{padding:16px 28px 0;font-size:26px;}
.foot2 .foot{border-top:none;}
.box.lp{width:860px;max-height:960px;display:flex;flex-direction:column;}
.lplist{overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.lpi{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:10px;cursor:pointer;font-size:23px;font-weight:700;
  background:rgba(var(--accent-rgb),0.07);border:1px solid rgba(var(--accent-rgb),0.2);}
.lpi.sel{background:rgba(var(--accent-rgb),0.3);border-color:var(--accent);}
.lpi.dis{opacity:.4;cursor:default;}
.lpi .ck{width:30px;color:var(--green);}
.lpi .ds{font-size:17px;color:var(--text-sub);font-weight:600;margin-left:auto;}
.lplist.grid{display:grid;gap:10px;}
.lplist.grid .lpi{justify-content:center;padding:20px 8px;}
.lplist.grid .ck{display:none;}
.lph{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--text-sub);margin:8px 0 2px;}
</style>
</head>
<body>
<!-- RULE LIST -->
<div id="s-list" class="screen on">
  <div class="hdr">
    <span class="ttl">&#9889; AUTOMATION</span>
    <div style="display:flex;gap:12px;">
      <button class="btn go" onclick="openBuilder(null)">+ NEW AUTOMATION</button>
      <button class="btn close" onclick="goHome()">&#10005; CLOSE</button>
    </div>
  </div>
  <div id="b-demo" class="banner amber">DEMO DATA &mdash; not connected to the Pi. Changes here are not saved.</div>
  <div id="b-engine" class="banner red"></div>
  <div id="b-file" class="banner red"></div>
  <div id="b-clock" class="banner amber">Clock not synced yet &mdash; time rules are on hold until it is.</div>
  <div class="body">
    <div class="label">Active now</div>
    <div id="active"></div>
    <div class="label">Rules</div>
    <div id="rules" style="display:flex;flex-direction:column;gap:12px;"></div>
  </div>
</div>

<!-- RULE BUILDER: one form, sections open as you go -->
<div id="s-build" class="screen">
  <div class="hdr">
    <span id="b-title" class="ttl">&#9889; NEW AUTOMATION</span>
    <button class="btn close" onclick="cancelBuilder()">&#10005; CANCEL</button>
  </div>
  <div id="b-body" class="body form"></div>
  <div class="foot2">
    <div id="b-sent" class="sent"></div>
    <div class="foot">
      <div id="b-msg" class="msg"></div>
      <button id="b-del" class="btn danger" onclick="deleteRule()">DELETE</button>
      <button id="b-save" class="btn go" onclick="saveRule()">SAVE &#10003;</button>
    </div>
  </div>
</div>

<!-- dropdown list panel -->
<div id="lp" class="modal"><div class="box lp">
  <div id="lp-t" class="q"></div><div id="lp-list" class="lplist"></div>
  <div class="row"><button id="lp-done" class="btn go" onclick="listDone()">DONE</button></div></div></div>

<div id="modal" class="modal"><div class="box"><div id="m-q" class="q"></div>
  <div class="row"><button class="btn" onclick="modalDone(false)">NO</button>
  <button id="m-yes" class="btn danger" onclick="modalDone(true)">YES</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* ---------- basics ---------- */
const DEMO = new URLSearchParams(location.search).has('demo');
const TF = (localStorage.getItem('dashTimeFormat') || '24') === '12';
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAYNAME = {mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat',sun:'Sun'};
const SUNEV = ['dawn','sunrise','sunset','dusk'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = id => document.getElementById(id);
let RULES = [], STATUS = null, STATUS_ERR = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function add(parent, ...kids) { kids.forEach(k => k && parent.appendChild(typeof k === 'string' ? document.createTextNode(k) : k)); return parent; }
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s) {            // "2026-10-05T06:45" (local) -> Date
  const [d, t = '00:00'] = s.split('T'); const [y, m, dd] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number);
  return new Date(y, m - 1, dd, h, mi);
}
function fmtHM(h, m) {
  if (!TF) return pad(h) + ':' + pad(m);
  return ((h % 12) || 12) + ':' + pad(m) + (h < 12 ? ' AM' : ' PM');
}
function fmtTime(d) { return fmtHM(d.getHours(), d.getMinutes()); }
function fmtDay(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0); const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((x - t) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow';
  return DAYNAME[DAYS[(d.getDay() + 6) % 7]] + ' ' + MON[d.getMonth()] + ' ' + d.getDate();
}
function dur(min) {
  min = Math.abs(min); const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m || !h ? m + ' min' : '');
}
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', err ? 6000 : 2500);
}
let _modalCb = null;
function ask(q, yesLabel, cb) { $('m-q').textContent = q; $('m-yes').textContent = yesLabel; _modalCb = cb; $('modal').className = 'modal on'; }
function modalDone(yes) { $('modal').className = 'modal'; const cb = _modalCb; _modalCb = null; if (yes && cb) cb(); }
function goHome() { location.href = document.documentElement.classList.contains('phone') ? '/m/auto.html' : '/'; }

/* ---------- data: real API, or demo data when not on the Pi ---------- */
async function api(method, path, body) {
  if (DEMO) return demoApi(method, path, body);
  const r = await fetch('/api/v2' + path, {method, headers: {'Content-Type': 'application/json'},
                                          body: body === undefined ? undefined : JSON.stringify(body)});
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && (j.detail || j.error)) || ('HTTP ' + r.status));
  return j;
}
async function loadRules() {
  try { RULES = (await api('GET', '/rules')).rules || []; }
  catch (e) { toast('Could not load rules: ' + e.message, true); }
}
async function loadStatus() {
  try { STATUS = await api('GET', '/status'); STATUS_ERR = null; }
  catch (e) { STATUS_ERR = e.message; }
}

const D = (function () {           // demo store
  const now = new Date(), iso = (d, h, m) => ymd(d) + 'T' + pad(h) + ':' + pad(m);
  const nextWd = () => { const d = new Date(now); do { d.setDate(d.getDate() + 1); } while ([0, 6].includes(d.getDay())); return d; };
  const later = new Date(now.getTime() + 95 * 60000);
  return {
    rules: [
      {id: 'bus_light', enabled: true, targets: ['group:outdoor_flood_lights'], state: 'on',
       start: {clock: '06:45'}, end: {clock: '07:10'}, days: ['mon','tue','wed','thu','fri'], skip_dates: [],
       dates: {from: '08-20', until: '06-05', yearly: true}},
      {id: 'porch_evening', enabled: true, targets: ['front_door_flood'], state: 'on',
       start: {sun: 'sunset', offset_min: -15}, end: {clock: '23:00'}, skip_dates: []},
      {id: 'dawn_deck', enabled: false, targets: ['side_deck_flood'], state: 'on',
       start: {sun: 'dawn', offset_min: -20}, end: {sun: 'sunrise', offset_min: 0}, skip_dates: []},
      {id: 'garage_test', enabled: true, targets: ['garage_flood'], state: 'on',
       start: {clock: '21:00'}, end: {clock: '21:30'}, skip_dates: []}],
    status: {v: 1, ts: Math.floor(now / 1000), clock_ok: true, engine: '0.2',
      sun: {date: ymd(now), dawn: '06:53', sunrise: '07:20', sunset: '18:58', dusk: '19:25'},
      rules: {
        bus_light: {active: false, next_start: iso(nextWd(), 6, 45), next_end: iso(nextWd(), 7, 10), broken: []},
        porch_evening: {active: true, next_start: iso(now, 18, 43), next_end: iso(now, 23, 0), broken: []},
        dawn_deck: {active: false, next_start: null, next_end: null, broken: []},
        garage_test: {active: false, next_start: iso(now, 21, 0), next_end: iso(now, 21, 30), broken: ['garage_flood']}},
      problems: {},
      devices: {
        front_door_flood: {name: 'Front Door', group: 'Outdoor Flood Lights', group_id: 'outdoor_flood_lights', online: true,
          in_inventory: true, state: 'on', watts: 78.0, want: 'on', confirmed: true, manual: false, by: 'porch_evening', until: iso(now, 23, 0)},
        side_deck_flood: {name: 'Side Deck', group: 'Outdoor Flood Lights', group_id: 'outdoor_flood_lights', online: false,
          in_inventory: true, state: 'off', watts: 0, want: null, confirmed: false, manual: false, by: null, until: null}},
      groups: {outdoor_flood_lights: {name: 'Outdoor Flood Lights', members: ['front_door_flood', 'side_deck_flood'], rename_safe: true}}}
  };
})();
function demoApi(method, path, body) {
  const clone = x => JSON.parse(JSON.stringify(x)), find = id => D.rules.find(r => r.id === id);
  D.status.ts = Math.floor(Date.now() / 1000);
  if (path === '/status') return Promise.resolve(clone(D.status));
  if (path === '/rules' && method === 'GET') return Promise.resolve({v: 1, rules: clone(D.rules)});
  if (path === '/rules' && method === 'POST') { D.rules.push(clone(body)); return Promise.resolve(clone(body)); }
  const m = path.match(/^\/rules\/([a-z0-9_]+)(?:\/(enabled|skip-next))?$/), r = m && find(m[1]);
  if (!r) return Promise.reject(new Error('no such rule'));
  if (method === 'PUT') { Object.keys(r).forEach(k => delete r[k]); Object.assign(r, clone(body)); return Promise.resolve(clone(r)); }
  if (method === 'DELETE') { D.rules.splice(D.rules.indexOf(r), 1); return Promise.resolve({ok: true}); }
  if (m[2] === 'enabled') { r.enabled = body.enabled; return Promise.resolve(clone(r)); }
  if (m[2] === 'skip-next') {
    const s = D.status.rules[r.id];
    if (!s || !s.next_start) return Promise.reject(new Error('no upcoming run to skip'));
    r.skip_dates.push(s.next_start.slice(0, 10));
    if (s.active) { s.active = false; } return Promise.resolve(clone(r));
  }
  return Promise.reject(new Error('demo: not handled'));
}

/* ---------- sentences ---------- */
function targetName(t) {
  const S = STATUS || {groups: {}, devices: {}};
  if (t.startsWith('group:')) { const g = (S.groups || {})[t.slice(6)]; return g ? g.name : t.slice(6) + ' (missing)'; }
  const d = (S.devices || {})[t]; return d ? d.name : t + ' (missing)';
}
function joinAnd(a) { return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function edgeText(e) {
  if (!e) return null;
  if (e.clock) { const [h, m] = e.clock.split(':').map(Number); return fmtHM(h, m); }
  const o = e.offset_min || 0;
  return o === 0 ? e.sun : dur(o) + (o < 0 ? ' before ' : ' after ') + e.sun;

function daysText(days) {

  const sub = el('div', 'sub'), first = new Date(), c = B.cal;
  first.setDate(1); first.setHours(0, 0, 0, 0);
  const months = (c.getFullYear() - first.getFullYear()) * 12 + c.getMonth() - first.getMonth();
  const nav = el('div', 'calnav');
  const prev = btn('\u25C0', '', () => { B.cal = new Date(c.getFullYear(), c.getMonth() - 1, 1); renderBuilder(); }); prev.disabled = months <= 0;
  const next = btn('\u25B6', '', () => { B.cal = new Date(c.getFullYear(), c.getMonth() + 1, 1); renderBuilder(); }); next.disabled = months >= 11;
  add(nav, prev, el('div', 'm', MON[c.getMonth()] + ' ' + c.getFullYear()), next, el('div', 'meta', 'Tap a day to skip it. Solid days are days it runs.'));
  const cal = el('div', 'cal'); DAYS.forEach(x => add(cal, el('div', 'h', DAYNAME[x].toUpperCase())));
  for (let i = 0; i < (c.getDay() + 6) % 7; i++) cal.appendChild(el('div'));
  for (let day = new Date(c); day.getMonth() === c.getMonth(); day.setDate(day.getDate() + 1)) {
    const s = ymd(day), md = s.slice(5), g = d.dates;
    const inR = !g || (g.yearly ? (g.from <= g.until ? md >= g.from && md <= g.until : md >= g.from || md <= g.until) : s >= g.from && s <= g.until);
    const runs = inR && d.days.includes(DAYS[(day.getDay() + 6) % 7]), skp = d.skip_dates.includes(s), past = s < today;
    const cell = el('div', 'd' + (runs ? ' run' : '') + (skp ? ' skp' : '') + (past ? ' past' : ''), String(day.getDate()));
    if (!past) cell.onclick = () => { d.skip_dates = skp ? d.skip_dates.filter(x => x !== s) : d.skip_dates.concat(s).sort(); renderBuilder(); };
    cal.appendChild(cell);
  }
  add(sub, nav, cal); r.appendChild(sub); return r;
}

async function saveRule() {
  const d = B.draft, y = new Date(); y.setDate(y.getDate() - 1);
  const rule = {id: d.id, enabled: d.enabled !== false, targets: d.targets.slice(), state: 'on', start: d.start, end: d.end,
                days: DAYS.filter(x => d.days.includes(x)),
                skip_dates: [...new Set(d.skip_dates)].filter(x => x >= ymd(y)).sort()};   // keep yesterday: a run may still be going
  if (d.dates) rule.dates = clone(d.dates);
  if (problem(d)) return;
  $('b-save').disabled = true;
  try {
    if (B.isNew) await api('POST', '/rules', rule); else await api('PUT', '/rules/' + rule.id, rule);
    toast(B.isNew ? 'Rule saved' : 'Changes saved'); show('s-list'); refresh();
  } catch (e) { toast('Not saved: ' + e.message, true); $('b-save').disabled = false; }
}
function deleteRule() {
  ask('Delete this automation? If it is running now, its lights turn off unless another rule wants them on.', 'DELETE', async () => {
    try { await api('DELETE', '/rules/' + B.draft.id); toast('Rule deleted'); show('s-list'); refresh(); }
    catch (e) { toast('Not deleted: ' + e.message, true); }
  });
}

/* ---------- idle return, polling, start ---------- */
let lastTouch = Date.now();
document.addEventListener('pointerdown', () => { lastTouch = Date.now(); }, true);
setInterval(() => {
  const idle = Date.now() - lastTouch, building = $('s-build').classList.contains('on');
  if (!DEMO && !document.documentElement.classList.contains('phone') && idle > (building ? 10 : 3) * 60000) goHome();     // never strand the wall on this page
}, 15000);
setInterval(async () => { if ($('s-list').classList.contains('on')) { await loadStatus(); renderList(); } }, 5000);
setInterval(() => { if ($('s-list').classList.contains('on')) refresh(); }, 30000);
refresh();
</script>
